name: Refresh security snapshot

on:
  schedule:
    # Every 3 hours at :37, offset from research and release refresh jobs.
    #
    # This asked for hourly until 2026-09-05 and never got it. GitHub treats
    # schedules as best-effort and drops them under load, so the job actually
    # fired about 7 times a day at 2.1-5.0 hour gaps, and never at :37 -- every
    # run succeeding, just not when asked. Declaring 3-hourly matches what the
    # scheduler will actually deliver. If the snapshot ever needs to be fresher
    # than this, it needs a trigger that is not GitHub's cron: the endpoint is
    # POST /api/cron/refresh-security behind CRON_SECRET, callable by anything.
    - cron: '37 */3 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hit refresh endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REFRESH_URL: ${{ secrets.REFRESH_SECURITY_URL || 'https://freshcrateai-production.up.railway.app/api/cron/refresh-security' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is not set in repo settings"
            exit 1
          fi
          if [ -z "${REFRESH_URL:-}" ]; then
            echo "::error::REFRESH_URL is not set"
            exit 1
          fi
          status=$(curl -sS -o /tmp/body -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 300 \
            "${REFRESH_URL}")
          echo "HTTP status: $status"
          echo "Response body:"
          cat /tmp/body
          echo
          if [ "$status" != "200" ]; then
            echo "::error::Refresh endpoint returned HTTP $status"
            exit 1
          fi
          python3 -m json.tool < /tmp/body
